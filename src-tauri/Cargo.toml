[package]
name = "receipt-to-room"
version = "0.1.9"
description = "Local receipt OCR and room inventory"
authors = ["Param Factory"]
license = "MIT"
edition = "2021"

[lib]
name = "receipt_to_room_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"
